services:
  - type: web
    name: community360
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PORT
        value: "3306"
      - key: DB_SSL
        value: "true"
      - key: AWS_REGION
        value: us-east-2
      - key: DYNAMO_TABLE_INTERACCIONES
        value: community360_interacciones
      - key: DYNAMO_TABLE_CUARENTENA
        value: community360_cuarentena
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
